# IAM service configuration (config.yaml). Loaded from $CONFIG_PATH or ./.
# Every key can be overridden by its UPPER_SNAKE_CASE env var, e.g.
# INFRA_POSTGRES_PASSWORD, SERVICE_HTTP_ADDR. Defaults are shown.
infra:
  postgres:
    host: localhost
    port: 5432
    username: iam
    password: iam
    database: iam
    sslmode: require          # disable | require | verify-ca | verify-full
    log_level: info           # debug | info | warn | error

service:
  http:
    addr: ":8080"
    public_url: ""            # REQUIRED: absolute base URL this deployment is reachable at, e.g. https://auth.example.com (no trailing slash). Sole source of the OIDC issuer ({public_url}/p/{project_id}/e/{env}) and of every absolute URL in the discovery document. Never inferred from Host/X-Forwarded-* — a request header must not decide the issuer clients pin. Service refuses to start without it. (SERVICE_HTTP_PUBLIC_URL)
    probe_addr: ":8081"       # separate liveness/readiness port; set "" or =addr to mount probes under /healthz/ on the main port
    read_timeout_sec: 15
    write_timeout_sec: 30
    shutdown_sec: 15
    trusted_proxies: []       # CIDRs/IPs of reverse proxies to trust for X-Forwarded-For/X-Real-IP. Empty = ignore forwarding headers and use the real TCP peer, so clients cannot spoof their IP to bypass IP-keyed rate limits. Set this to your LB/ingress network when behind a proxy. (SERVICE_HTTP_TRUSTED_PROXIES)
  logger:
    level: info               # debug | info | warn | error
    format: json              # json | text
  cors:
    allowed_origins: []
  auth:
    # NOTE: token TTLs and the acting environment are NOT set here — access /
    # refresh TTLs come from each project's session_policy config doc, and the
    # environment is chosen per request via the X-Environment header.
    master_key: ""            # operator master-key credential; empty disables the masterKey scheme (set via MASTER_KEY)
    encryption_key: ""        # REQUIRED: base64 32-byte AES-256 key; encrypts reversible secrets at rest. Service refuses to start without it. (SERVICE_AUTH_ENCRYPTION_KEY)
    seed_root: false          # dev: ensure a "Root" project exists on startup so the operator (master_key) has something to manage (SERVICE_AUTH_SEED_ROOT)
