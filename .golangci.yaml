version: "2"
run:
  go: "1.26"
output:
  formats:
    text:
      path: stdout
  sort-order:
    - linter
    - severity
    - file
linters:
  default: none
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - gomoddirectives
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - ireturn
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
  settings:
    errcheck:
      check-type-assertions: true
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        # A cancelled context is the caller's own doing. "store: context
        # canceled" tells them something they already know.
        - ctx.Err(
      ignore-package-globs:
        # This module's own errors already carry this module's vocabulary.
        # An error from our own port has a name we chose and a package that
        # says where it came from; wrapping it again produces
        # "flow: flow: not found" — noise that buries the real prefix.
        # Whole module rather than a list so it can't go silently stale.
        - github.com/gopherex/iam/*
      ignore-interface-regexps:
        # A guard, a session, a cache: each is a wrapper whose whole job is
        # to pass through what it wraps. An error decorated on the way out
        # of one says only that it went through, which the caller knows.
        - ^github\.com/gopherex/iam/
    exhaustive:
      # maps here are partial by design (message templates, format
      # extensions); only switches must be exhaustive.
      check:
        - switch
      # A `default:` case is not a substitute for listing every value: it is
      # how a switch says "and everything else", which is a different claim
      # from "I considered each of these". Left at the tool's default (false)
      # so adding an enum value still forces every switch over it to look at
      # the new case, not silently fall into whatever default was already
      # there.
    cyclop:
      max-complexity: 15
    funlen:
      lines: 75
    gocognit:
      min-complexity: 30
    gocritic:
      disabled-checks:
        - dupImport
        - octalLiteral
        # Domain types here are immutable and passed by value on purpose.
        # The decisive reason is nil: a pointer can be one, so every method
        # would have to tolerate it and every caller remember — while a
        # value's zero is safe, composes as a map key, and compares with ==.
        - hugeParam
        - whyNoLint
        # contradicts nonamedreturns, which we keep
        - unnamedResult
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
        - opinionated
      settings:
        captLocal:
          paramsOnly: false
        underef:
          skipRecvDeref: false
    govet:
      disable:
        - fieldalignment
      enable-all: true
      settings:
        shadow:
          strict: true
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - generic
        # Adapters legitimately return the ports they implement; the ports
        # live beside the domain they belong to.
        - github.com/gopherex/iam/internal/domain
        - github.com/gopherex/iam/pkg/api
        # The ogen-generated server contract is an interface with no
        # concrete type: an accessor handing one back hands back exactly
        # what the generated code defines.
        - github.com/gopherex/iam/internal/oas
        # A probe and a reporter are the health library's own ports.
        - github.com/gopherex/xprobe
        # Cipher/Authenticator are this package's own ports: the constructor
        # picks the concrete impl (identity vs AES-GCM, remote vs local vs
        # hybrid) and the caller is meant to see only the interface.
        - github.com/gopherex/iam/internal/infrastructure/postgres
        - github.com/gopherex/iam/pkg/sdk
        # bob.Executor/scan.Rows/pgtxlib.Trm are the SQL toolkit's own
        # interfaces — our adapter satisfies and hands back exactly their
        # shape, there is no concrete type of ours to return instead.
        - github.com/stephenafamo/bob
        - github.com/stephenafamo/scan
        - github.com/gopherex/pgtx
        # jwk.Set/jwt.Token are the JOSE library's interfaces for a key set /
        # parsed token; there is no concrete type underneath to hand back.
        - github.com/lestrrat-go/jwx
    mnd:
      ignored-functions:
        - cobra.ExactArgs
        - cobra.MaximumNArgs
        - cobra.MinimumNArgs
        - cobra.RangeArgs
    lll:
      line-length: 120
    misspell:
      locale: US
      ignore-rules:
        - cancelled
    nakedret:
      max-func-lines: 0
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-no-explanation:
        - funlen
        - gocognit
        - lll
      allow-unused: false
    tagliatelle:
      case:
        rules:
          json: snake
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
    varnamelen:
      max-distance: 5
      min-name-length: 3
      check-receiver: false
      check-return: false
      check-type-param: false
      ignore-names:
        - err
        - tx
        - id
        - ok
        - db
        - w
        - r
        - f
        - s
        - k
        - v
        - m
        - b
        - l
        - o
        - t
        - c
        - e
        - i
        - n
        - a
        - p
        - x
        - to
        - ns
        - ch
        - vs
        - it
        - re
        - st
        - en
        - ts
        - in
        - aal
        - amr
        - sid
        - jwt
        - kid
        - otp
      ignore-decls:
        - t testing.T
        - e error
        - i int
        - const C
        - T any
        - m map[string]int
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # allowed() deliberately refreshes the shared CORS-origin cache on its
      # own bounded context rather than the calling request's — see the
      # comment on the function. Excluded here rather than by //nolint
      # because contextcheck's finding on this exact call is itself
      # nondeterministic between otherwise-identical clean-cache runs (a
      # call-graph reconstruction issue, not this code); an inline directive
      # that is only sometimes "used" would make nolintlint fail the build
      # for no reason on the runs where it doesn't fire.
      - linters:
          - contextcheck
        path: ^pkg/api/cors\.go$
        text: 'Function `allowed`'
      # ogen renders a handler method's name straight from the OpenAPI
      # operationId, which spells it Id — implementing the generated
      # interface means matching that spelling exactly, not a style choice
      # we get to make. Everywhere else var-naming stays on: it is what
      # would have caught ExternalId/rpId/accountId as they were introduced.
      - linters:
          - revive
        path: ^pkg/api/
        text: var-naming
      # Adapters (`func NewPgXxx(...) *pgXxx`) return the unexported concrete
      # type on purpose: the exported surface is the port they implement, in
      # internal/domain or pkg/api, and constructing one somewhere that only
      # knows the concrete type is exactly the coupling ireturn's allow-list
      # above exists to keep out. revive's opinion here is the mirror image of
      # a choice this config already made once; a repo-wide exclusion, not a
      # per-file one, because every future NewPgXxx follows the same pattern.
      - linters:
          - revive
        text: unexported-return
      - linters:
          - lll
        source: ^//\s*go:generate\s
      - linters:
          - godot
        source: (noinspection|TODO)
      - linters:
          - gocritic
        source: //noinspection
      # Test code: style linters that are about production code being read
      # for years do not apply to fixtures read while written and when they
      # fail; the numbers in a test are the test, not magic.
      - linters:
          - bodyclose
          - containedctx
          - dupl
          - err113
          - errcheck
          - forcetypeassert
          - funlen
          - goconst
          - gosec
          - noctx
          - wrapcheck
          - gochecknoglobals
          - cyclop
          - gocognit
          - lll
          - maintidx
          - ireturn
          - gocritic
          - mnd
          - prealloc
          - unparam
          - contextcheck
          - varnamelen
          - dupword
          # A mock handler returning (nil, nil) records that it ran; the
          # ambiguity nilnil warns about — can the caller tell "nothing" from
          # "not yet" — does not apply to a stub whose only job is being called.
          - nilnil
          # White-box tests: the package's own unexported helpers (issuer
          # building, claim parsing, password scoring) are tested directly, so
          # test files live in the package under test, not in an _test package.
          - testpackage
        path: _test\.go
      # Named results on a multi-value return of the SAME type are what says
      # which string is which — `(token, hash string, err error)` reads and
      # `(string, string, error)` does not. The risk the linter guards against
      # is the naked return, and nakedret already catches that.
      - linters:
          - nonamedreturns
        text: 'named return "(token|hash|mode|passwordStrategy|subject|email|certPEM|keyPEM|fingerprint|plaintext|prefix|rpID|displayName|origins|err|r)"'
      # Wire formats we do not own: the WebAuthn ceremony (`publicKey`,
      # `accountId`), a captcha provider's reply (`error-codes`), and the
      # persisted jsonb envelopes, whose keys are the Go field names — renaming
      # one of those does not fix a style problem, it orphans stored rows.
      - linters:
          - tagliatelle
        path: (webauthn_cmd|email_publisher|admin_pg|coreauth_pg|oidc_pg|domain)\.go
      - linters:
          - govet
        text: 'shadow: declaration of "(err|ctx)" shadows declaration at'
      # A command's error is printed to the person who ran it, already
      # prefixed with the binary name. A second prefix naming the function
      # that returned it is noise where the words matter most.
      - linters:
          - wrapcheck
        path: ^cmd/
      # pkg/api repeatedly reshapes a domain value (or an already-decoded
      # ogen struct) into an ogen response via marshal-then-Unmarshal/Encode.
      # The inputs are our own plain data (structs of strings/ints/times) or
      # already-valid JSON that ogen itself decoded, so Marshal cannot fail;
      # where it's the last-mile HTTP error writer (errors.go), the response
      # is already committed and there is no remedy for a failure anyway.
      - linters:
          - errchkjson
        path: ^pkg/api/
      # config_reader.go's own header documents its design contract: fail-OPEN
      # to defaults on any read/parse error, because it is the runtime path
      # every enforcement stage consults and must never brick auth on a
      # malformed doc. Every "return eff/nil, nil" on an unmarshal error here
      # is that contract, not a dropped error.
      - linters:
          - nilerr
        path: ^internal/infrastructure/postgres/config_reader\.go$
      # ServiceName/Version/Commit/BuildTime are set by -ldflags -X at release
      # build time, which only works on package-level string vars — there is
      # no const equivalent. InstanceID derives from them at package init.
      - linters:
          - gochecknoglobals
        path: ^internal/build/build\.go$
      # Read-only reference tables: enum sets (Has()-style lookups) and
      # dispatch/registry maps populated once (by a package var initializer or
      # an init() the file's own comment documents as "kinds register
      # themselves"), never mutated afterward. Go has no const map/slice, so a
      # var is the only way to express an immutable composite value.
      - linters:
          - gochecknoglobals
        path: ^internal/domain/(configspec|email_templates|webhook)\.go$
      - linters:
          - gochecknoglobals
        path: ^internal/infrastructure/postgres/(coreauth_flows_pg|coreauth_password|federation_pg|gc|provider_secrets|testmode_pg)\.go$
      # authLimiter/sensitiveLimiter/guestLimiter are process-wide rate
      # limiters — the bucket state they hold IS the thing being shared across
      # every request, so a package global is the design, not a shortcut.
      # trustedProxyNets is startup-configured once (SetTrustedProxies, called
      # from main before serving) and read-only for the life of the process;
      # threading it through every request handler would be pure ceremony.
      - linters:
          - gochecknoglobals
        path: ^pkg/api/(ratelimit|requestmeta)\.go$
      # AdminConnections and FederationConnections are two independent ports
      # (mgmt API vs federation API) that both happen to implement the same
      # find -> tenant-check -> act -> emit shape for SSO connections/domains
      # — the exact pattern repeated ~40 times across this package's adapters.
      # Templating it across two unrelated bounded contexts would trade a
      # dupl count for closures/generics that hide, not clarify, what each
      # adapter does.
      - linters:
          - dupl
        path: ^internal/infrastructure/postgres/(admin_connections_pg|federation_pg)\.go$
      # resolveOrCreateByEmail/ByPhone share a shape (lookup by one column,
      # flip a verified flag, or auto-provision) but differ in the column,
      # the account field, and the conflict error at every step — spelling
      # each channel out straight-line is clearer than a closure-driven
      # "channel descriptor" for two cases.
      - linters:
          - dupl
        path: ^internal/infrastructure/postgres/passwordless_pg\.go$
      # Each port in pkg/api is one domain aggregate's full set of atomic
      # operations (e.g. CoreAuthAccounts: register/auth/refresh/verify -
      # one account lifecycle), not a grab-bag; splitting at 10 methods would
      # cut through a single aggregate rather than separate concerns.
      - linters:
          - interfacebloat
        path: ^pkg/api/
    paths:
      - third_party$
      - builtin$
issues:
  max-same-issues: 50
formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: github.com/gopherex/iam
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/gopherex/iam)
        - localmodule
      custom-order: true
  exclusions:
    generated: lax
