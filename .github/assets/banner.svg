<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" fill="none" role="img" aria-label="IAM — Authentication and Identity">
  <defs>
    <clipPath id="round"><rect width="880" height="240" rx="16"/></clipPath>
    <linearGradient id="hex" x1="72" y1="72" x2="168" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="word" x1="208" y1="90" x2="360" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e6e6f0"/>
      <stop offset="1" stop-color="#b9b4f0"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.62 0 0 0 0 0.60 0 0 0 0 0.92 0 0 0 0.02 0"/>
    </filter>
  </defs>

  <g clip-path="url(#round)">
    <!-- graphite ground -->
    <rect width="880" height="240" fill="#141522"/>
    <!-- faint instrument grid -->
    <g stroke="#1d1f31" stroke-width="1">
      <path d="M0 60 H880 M0 120 H880 M0 180 H880"/>
      <path d="M190 0 V240 M770 0 V240"/>
    </g>
    <rect width="880" height="240" filter="url(#grain)" opacity="0.5"/>

    <!-- indigo accent edge, bottom -->
    <rect y="234" width="880" height="6" fill="#6366f1" opacity="0.55"/>

    <!-- mark: gradient hexagon with keyhole -->
    <g transform="translate(72 72)">
      <path d="M90 48 69 84.36H27L6 48 27 11.64h42L90 48Z" fill="url(#hex)"/>
      <path d="M28.8 14.7 69 14.7 87 48" fill="none" stroke="#fff" stroke-width="2.6" opacity="0.30" stroke-linecap="round"/>
      <circle cx="48" cy="40.2" r="9.45" fill="#fff"/>
      <path d="M41.1 46.2H54.9L58.5 68.7H37.5Z" fill="#fff"/>
    </g>

    <!-- wordmark -->
    <text x="208" y="126" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="70" font-weight="700" letter-spacing="3" fill="url(#word)">IAM</text>

    <!-- expanded line (mono) -->
    <text x="212" y="160" font-family="'IBM Plex Mono','SF Mono',ui-monospace,monospace" font-size="15" letter-spacing="0.4" fill="#8b8aa6">Identity&#160;&amp;&#160;Access&#160;Management&#160;·&#160;<tspan fill="#a5b4fc">Authentication</tspan></text>

    <!-- auth motif, right side: session token + flow -->
    <g font-family="'IBM Plex Mono',monospace" font-size="13" fill="#565778" text-anchor="end">
      <text x="808" y="92">aal: 2 · totp&#160;✓</text>
      <text x="808" y="112" fill="#a5b4fc">eyJhbGciOiJSUzI1NiJ9.</text>
      <text x="808" y="132">session&#160;·&#160;sliding&#160;refresh</text>
    </g>
  </g>
</svg>
